<!doctype html>
<html lang="it" class="scroll-smooth">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .Title }} | {{ .Site.Title }}</title>
    
    <!-- Motore Grafico Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    
    <!-- Configurazione Colori Istituzionali -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              istituzionale: '#1e293b', /* Ardesia scuro */
              accento: '#3b82f6', /* Blu sobrio */
            }
          }
        }
      }
    </script>
</head>

<body class="bg-gray-50 text-gray-800 font-sans flex flex-col min-h-screen">

    <!-- HEADER & MENU DINAMICO -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <!-- Logo / Nome -->
            <a href="/" class="text-xl font-bold text-istituzionale tracking-tight">Stefano Tripi</a>
            
            <!-- Menu di Navigazione -->
            <nav class="hidden md:flex space-x-6">
                <a href="/" class="text-gray-600 hover:text-accento transition">Home</a>
                {{ range .Site.Menus.main }}
                <a href="{{ .URL }}" class="text-gray-600 hover:text-accento transition">{{ .Name }}</a>
                {{ end }}
            </nav>
        </div>
    </header>

    <!-- CORPO CENTRALE (Le sue pagine) -->
    <main class="flex-grow max-w-5xl mx-auto px-4 py-10 w-full">
        {{ block "main" . }}{{ end }}
    </main>

    <!-- FOOTER CON MODULO CONTATTO -->
    <footer class="bg-istituzionale text-gray-300 py-12 mt-12">
        <div class="max-w-5xl mx-auto px-4 grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- Info e Contatti -->
            <div>
                <h3 class="text-white text-lg font-bold mb-4">Stefano Tripi</h3>             
                <div class="mt-8">
                    <a href="/privacy-policy" class="text-sm underline hover:text-white">Privacy Policy</a>
                </div>
            </div>

            <!-- Modulo Formspree (Vanilla JS Ajax) -->
        <div>
            <h3 class="text-white text-lg font-bold mb-4">Invia un messaggio</h3>
            
            <!-- Messaggio di Successo (Gestito da Formspree) -->
            <div data-fs-success class="bg-green-100 text-green-800 p-3 rounded-md mb-4 text-sm font-medium">
                Grazie! Il suo messaggio è stato inviato con successo.
            </div>
            
            <!-- Messaggio di Errore Generale -->
            <div data-fs-error class="bg-red-100 text-red-800 p-3 rounded-md mb-4 text-sm"></div>

            <form id="contact-form" class="space-y-4">
                <div>
                    <label for="email" class="block text-sm mb-1">Email</label>
                    <input type="email" id="email" name="email" data-fs-field required class="w-full px-3 py-2 text-gray-900 rounded-md focus:outline-none focus:ring-2 focus:ring-accento">
                    <!-- Spazio per errori specifici sull'email -->
                    <span data-fs-error="email" class="text-red-400 text-xs mt-1 block"></span>
                </div>
                <div>
                    <label for="message" class="block text-sm mb-1">Messaggio</label>
                    <textarea id="message" name="message" data-fs-field rows="3" required class="w-full px-3 py-2 text-gray-900 rounded-md focus:outline-none focus:ring-2 focus:ring-accento"></textarea>
                    <!-- Spazio per errori specifici sul messaggio -->
                    <span data-fs-error="message" class="text-red-400 text-xs mt-1 block"></span>
                </div>
                <button type="submit" data-fs-submit-btn class="bg-accento text-white px-6 py-2 rounded-md hover:bg-blue-600 transition disabled:opacity-50 disabled:cursor-not-allowed">Invia</button>
            </form>

            <!-- Script Formspree (Integrazione AJAX) -->
            <script>
              window.formspree = window.formspree || function () { (formspree.q = formspree.q || []).push(arguments); };
              formspree('initForm', { formElement: '#contact-form', formId: 'xyezgpyg' });
            </script>
            <script src="https://unpkg.com/@formspree/ajax@1" defer></script>
        </div>
            
        </div>
        <div class="text-center text-xs mt-8 text-gray-500">
            &copy; {{ now.Year }} Stefano Tripi. Tutti i diritti riservati.
        </div>
    </footer>

</body>
</html>
